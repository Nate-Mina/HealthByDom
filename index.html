    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dom-i-nately-theme') || 'auto';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var shouldBeDark = saved === 'dark' || (saved === 'auto' && prefersDark);
          if (shouldBeDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF8F5] dark:bg-stone-950 text-stone-900 dark:text-stone-100 antialiased selection:bg-amber-200 selection:text-stone-900 dark:selection:bg-amber-500/30 dark:selection:text-amber-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
